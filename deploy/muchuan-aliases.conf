server {
    listen 80;
    server_name www.muchuanxiaodian.xyz 8.162.15.119;
    return 308 https://muchuanxiaodian.xyz$request_uri;
}

server {
    listen 443 ssl;
    server_name www.muchuanxiaodian.xyz;
    ssl_certificate /etc/letsencrypt/live/muchuanxiaodian.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/muchuanxiaodian.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    return 308 https://muchuanxiaodian.xyz$request_uri;
}
