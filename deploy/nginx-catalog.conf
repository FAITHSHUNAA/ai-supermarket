limit_req_zone $binary_remote_addr zone=market_auth:10m rate=15r/m;
server {
    listen 80;
    server_name 8.162.15.119;
    root /opt/ai-supermarket/current/client/dist;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    location ~ ^/v1/auth/(register|login|captcha/challenge|recovery/(issue|reset))$ {
        limit_req zone=market_auth burst=12 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8787;
    }
    location ~ ^/v1/(auth/(session|logout|apps|refunds|delivery-report|usage|points-history|app-purchases/orders)|developer/(delivery-reports|wallet|application|clients(?:/[^/]+/commercial-offer)?)|payments/(notify/(wechat|alipay)|orders/[^/]+(?:/checkout)?))$ {
        proxy_pass http://127.0.0.1:8787;
    }
    location ~ ^/v1/(health$|platform/|market/(endpoints|suppliers)) {
        limit_except GET { deny all; }
        proxy_set_header Authorization "";
        proxy_set_header X-API-Key "";
        proxy_pass http://127.0.0.1:8787;
    }
    location /v1/ {
        default_type application/json;
        return 503 '{"error":"unavailable","message":"该服务尚未开放。"}';
    }
    location ~ ^/(llms\.txt|openapi\.json|developer-integration-guide\.md|examples/(api-key-invoke|oauth-pkce)\.mjs)$ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8787;
    }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri /index.html; }
}
