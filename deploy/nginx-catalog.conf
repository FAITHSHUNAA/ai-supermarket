server {
    listen 80;
    server_name 8.162.15.119;
    root /opt/ai-supermarket/current/client/dist;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    location = /v1/auth/session {
        default_type application/json;
        return 200 '{"user":null,"catalog_only":true}';
    }
    location ~ ^/v1/(health$|platform/|market/(endpoints|suppliers)) {
        limit_except GET { deny all; }
        proxy_set_header Authorization "";
        proxy_set_header X-API-Key "";
        proxy_set_header Cookie "";
        proxy_pass http://127.0.0.1:8787;
    }
    location /v1/ {
        default_type application/json;
        return 503 '{"error":"catalog_only","message":"目前开放商品浏览，上架和交易尚未开放。"}';
    }
    location ~ ^/(llms\.txt|openapi\.json|developer-integration-guide\.md|examples/(api-key-invoke|oauth-pkce)\.mjs)$ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8787;
    }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri /index.html; }
}
