server {
    listen 80;
    server_name muchuanxiaodian.xyz;
    return 301 https://muchuanxiaodian.xyz$request_uri;
}
server {
    listen 443 ssl;
    server_name muchuanxiaodian.xyz;
    ssl_certificate /etc/letsencrypt/live/muchuanxiaodian.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/muchuanxiaodian.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    root /opt/ai-supermarket/personal;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    location = /store { return 301 "/#resources"; }
    location / { try_files $uri $uri/ =404; }
}
