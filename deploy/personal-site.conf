map $arg_from $notes_source {
    default direct_or_other;
    share shared_link;
}
map $uri $notes_page {
    default 0;
    /index.html 1;
}
log_format notes_counts '$time_iso8601 $request_method $status $notes_source';
server {
    listen 80;
    server_name muchuanxiaodian.xyz;
    return 301 https://muchuanxiaodian.xyz$request_uri;
}
server {
    listen 443 ssl;
    server_name muchuanxiaodian.xyz;
    ssl_certificate /etc/letsencrypt/live/muchuanxiaodian.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/muchuanxiaodian.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    root /opt/ai-supermarket/personal;
    access_log /var/log/nginx/muchuan-visits.log notes_counts if=$notes_page;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    location = /store { return 301 "/#resources"; }
    location / { try_files $uri $uri/ =404; }
}
